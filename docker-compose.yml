# docker compose up --build   ->   UI on http://localhost:8050, API on http://localhost:8000/docs
# Two app containers: `api` (backend, built from ./Dockerfile) and `frontend` (UI, built from
# ./frontend/Dockerfile). The frontend gets no .env and reaches the API over HTTP only.
services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [mongo, qdrant, dev-issuer]
  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000          # sign-in: paste a token from the dev issuer (:9000) or Entra ID
    ports: ["8050:8050"]
    depends_on: [api]
  mongo:
    image: mongo:7
    volumes: ["mongo:/data/db"]
  qdrant:
    image: qdrant/qdrant:v1.11.0
    volumes: ["qdrant:/qdrant/storage"]
  dev-issuer:          # demo-only Entra stand-in; remove when AUTH_MODE=entra
    build: ./dev_issuer
    ports: ["9000:9000"]
volumes: { mongo: {}, qdrant: {} }
